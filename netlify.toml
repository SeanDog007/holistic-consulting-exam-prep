[build]
  publish = "."
  functions = "netlify/functions"

[functions]
  node_bundler = "esbuild"

[functions."*"]
  max_duration = 26

# send-study-reminders + send-trigger-emails schedules removed —
# study reminders and behavioral nurture now handled by Kit, not Resend.

# Grant prep-tool access to Circle exam-prep course members (paywall +
# Mentorship bundle). See netlify/functions/sync-circle-enrollments.js.
[functions."sync-circle-enrollments"]
  schedule = "*/10 * * * *"

[[headers]]
  for = "/.netlify/functions/*"
  [headers.values]
    Access-Control-Allow-Methods = "GET, POST, PATCH, DELETE, OPTIONS"
    Access-Control-Allow-Headers = "Content-Type, Authorization"
    Access-Control-Max-Age = "86400"
