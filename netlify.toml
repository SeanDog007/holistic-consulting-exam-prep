[build]
  publish = "."
  functions = "netlify/functions"

[functions]
  node_bundler = "esbuild"

[functions."*"]
  max_duration = 26

# send-study-reminders + send-trigger-emails schedules removed —
# study reminders and behavioral nurture now handled by Kit, not Resend.

# Grant prep-tool access to Circle exam-prep course members (paywall +
# Mentorship bundle). Once a day. Netlify cron is UTC and does not follow
# daylight saving: 07:17 UTC is 3:17am Eastern Daylight Time and 2:17am
# Eastern Standard Time. Minute 17 stays off :00. One roster page is one
# Admin API call, about 30/month at the current roster size.
# See netlify/functions/sync-circle-enrollments.js.
[functions."sync-circle-enrollments"]
  schedule = "17 7 * * *"

[[headers]]
  for = "/.netlify/functions/*"
  [headers.values]
    Access-Control-Allow-Methods = "GET, POST, PATCH, DELETE, OPTIONS"
    Access-Control-Allow-Headers = "Content-Type, Authorization"
    Access-Control-Max-Age = "86400"
